spring:
    application:
        name: Despacho
    
    datasource:
        url: jdbc:mysql://localhost:3306/despacho_db
        username: root
        password: ""
    
    jpa:
        hibernate:
            ddl-auto: create-drop
        show-sql: true
    
springdoc:    
    api-docs:
        enabled: true
        version: openapi_3_0
    swagger-ui:
        enabled: true
    
    
eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/

server:
    port: 8084